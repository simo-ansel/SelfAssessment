# Il frontend è la radice del sito; /api punta al backend.
# Solo backend/public è raggiungibile dal browser: src/ resta privato.
<VirtualHost *:80>
    DocumentRoot /var/www/html/frontend
    <Directory /var/www/html/frontend>
        Options -Indexes
        Require all granted
        # Il browser ricontrolla ogni file prima di usare la copia in cache:
        # dopo un aggiornamento non restano mai versioni vecchie mescolate a nuove.
        Header set Cache-Control "no-cache"
    </Directory>

    Alias /api /var/www/html/backend/public
    <Directory /var/www/html/backend/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
