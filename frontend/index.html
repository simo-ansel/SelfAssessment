<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Self Assessment Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar border-bottom">
    <div class="container contenuto">
        <span class="navbar-brand fw-semibold">Self Assessment Quiz</span>
    </div>
</nav>

<main class="container stretto py-5">
    <header class="text-center mb-5">
        <h1 class="h2 fw-semibold">Chi sei?</h1>
        <p class="text-secondary mb-0">Scegli il tuo profilo per entrare, oppure creane uno nuovo.</p>
    </header>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <section class="card h-100">
                <header class="card-header">
                    <h2 class="h6 mb-0">Docenti</h2>
                    <span class="small text-secondary">creano i quiz</span>
                </header>
                <div id="elenco-docenti" class="list-group list-group-flush"></div>
            </section>
        </div>
        <div class="col-md-6">
            <section class="card h-100">
                <header class="card-header">
                    <h2 class="h6 mb-0">Studenti</h2>
                    <span class="small text-secondary">svolgono i quiz</span>
                </header>
                <div id="elenco-studenti" class="list-group list-group-flush"></div>
            </section>
        </div>
    </div>

    <section class="card">
        <form id="form-utente" class="card-body row g-3 align-items-end" novalidate>
            <div class="col-md-6">
                <label class="form-label" for="nuovo-nome">Nuovo profilo</label>
                <input id="nuovo-nome" class="form-control" type="text" placeholder="Nome e cognome" autocomplete="off">
            </div>
            <div class="col-md-4">
                <div class="btn-group w-100" role="group" aria-label="Ruolo">
                    <input type="radio" class="btn-check" name="ruolo" id="ruolo-docente" value="docente" checked>
                    <label class="btn btn-outline-secondary" for="ruolo-docente">Docente</label>
                    <input type="radio" class="btn-check" name="ruolo" id="ruolo-studente" value="studente">
                    <label class="btn btn-outline-secondary" for="ruolo-studente">Studente</label>
                </div>
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-primary" type="submit">Crea</button>
            </div>
        </form>
    </section>
</main>

<div id="avvisi" class="avvisi" aria-live="polite"></div>

<script src="js/models/Session.js"></script>
<script src="js/models/ApiService.js"></script>
<script src="js/views/Osservabile.js"></script>
<script src="js/views/Dom.js"></script>
<script src="js/views/HomeView.js"></script>
<script src="js/presenters/HomePresenter.js"></script>
<script>
    new HomePresenter(new HomeView()).init();
</script>
</body>
</html>
